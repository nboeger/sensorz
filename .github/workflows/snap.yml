name: snap

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      snap-file: ${{ steps.snap-name.outputs.snap }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install snapcraft and build dependencies
        run: |
          sudo snap install core22
          sudo snap install snapcraft --classic
          sudo apt-get update -q
          sudo apt-get install -y gcc
          echo "/snap/bin" >> "$GITHUB_PATH"

      - name: Build snap
        run: |
          snapcraft --destructive-mode

      - name: Record snap file name
        id: snap-name
        run: echo "snap=$(ls *.snap | head -1)" >> "$GITHUB_OUTPUT"

      - name: Verify snap installs and runs
        run: |
          sudo snap install --dangerous "${{ steps.snap-name.outputs.snap }}"
          sensorz -h

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensorz-snap
          path: ${{ steps.snap-name.outputs.snap }}

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sensorz-snap
          path: .

      - name: Check store login secret is configured
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::error::STORE_LOGIN secret is not set. Add it in GitHub -> Settings -> Secrets and variables -> Actions (from 'snapcraft export-login')."
            exit 1
          fi

      - name: Publish snap to store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        with:
          snap: ${{ needs.build.outputs.snap-file }}
          release: stable
